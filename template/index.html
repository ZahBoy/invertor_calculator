<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1></h1>
    <p class="lead"></p>

    <form action="" method="get">
      <section class="card bar">
        <label><input type="number" name="budget"></label>
        <label><select name="voltage"></select></label>
        <label><select name="power"></select></label>
        <div class="actions">
          <button type="reset" class="btn ghost"></button>
          <button type="submit" class="btn"></button>
        </div>
      </section>

      <section class="card variant">
        <h2></h2>
        <div class="row">
          <label class="model"><select name="model1"></select></label>
          <label><input type="number" name="price1"></label>
          <label><input type="number" name="rel1"></label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>

      <section class="card variant">
        <h2></h2>
        <div class="row">
          <label class="model"><select name="model2"></select></label>
          <label><input type="number" name="price2"></label>
          <label><input type="number" name="rel2"></label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>

      <section class="card variant">
        <h2></h2>
        <div class="row">
          <label class="model"><select name="model3"></select></label>
          <label><input type="number" name="price3"></label>
          <label><input type="number" name="rel3"></label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>
    </form>

    <div class="grid2">
      <section class="card">
        <h3></h3>
        <ul class="chart">
          <!-- рядок: <li><span class="name"></span><span class="track"><span class="fill good|mid|bad" style="--v: N%"></span></span><span class="val"></span></li> -->
        </ul>
      </section>

      <section class="card">
        <h3></h3>
        <table class="verdict">
          <thead><tr><th></th><th></th><th></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <p class="best"></p>
      </section>
    </div>
  </main>
</body>
</html>
