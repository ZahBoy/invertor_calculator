<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Підбір інвертора</h1>
    <p class="lead">Оберіть три моделі, вкажіть бюджет, напругу та потужність - ми знайдемо оптимальний варіант</p>

    <form action="" method="get">
      <section class="card bar">
        <label><input type="number" name="budget">Ваш бюджет</label>
        <label><select name="voltage"></select>Напруга</label>
        <label><select name="power"></select>Потужність</label>
        <div class="actions">
          <button type="reset" class="btn ghost">Скинути</button>
          <button type="submit" class="btn">Розрахувати</button>
        </div>
      </section>

      <section class="card variant">
        <h2>1. Перший інвертор</h2>
        <div class="row">
          <label class="model"><select name="model1"></select>Модель</label>
          <label><input type="number" name="price1">Ціна (у гривнях)</label>
          <label><input type="number" name="rel1">Надійність</label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>

      <section class="card variant">
        <h2></h2>
        <div class="row">
          <label class="model"><select name="model2"></select>Модель</label>
          <label><input type="number" name="price2">Ціна (у гривнях)</label>
          <label><input type="number" name="rel2">Надійність</label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>

      <section class="card variant">
        <h2></h2>
        <div class="row">
          <label class="model"><select name="model3"></select>Модель</label>
          <label><input type="number" name="price3">Ціна (у гривнях)</label>
          <label><input type="number" name="rel3">Надійність</label>
          <output class="total"></output>
        </div>
        <p class="hint"></p>
      </section>
    </form>

    <div class="grid2">
      <section class="card">
        <h3>Порівняння ризиків</h3>
        <ul class="chart">
          <li>
              <span class="name">Шанс залишитися без живлення за 5 років гарантії. Менше - краще</span>
              <span class="track">
                  <span class="fill good|mid|bad" style="--v: N%"></span>
              </span>
              <span class="val"></span>
          </li>
        </ul>
      </section>

      <section class="card">
        <h3>Висновок</h3>
        <table class="verdict">
          <thead>
          <tr>
              <th>Варіант</th>
              <th>Ціна</th>
              <th>Ризик</th>
              <th>Бюджет</th>
          </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p class="best"></p>
      </section>
    </div>
  </main>
</body>
</html>
