    <h1>Підбір інвертора</h1>
    <p class="lead">Оберіть три моделі, вкажіть бюджет, напругу та потужність - ми знайдемо оптимальний варіант</p>

    <form action="/" method="post">
      <section class="card bar">
        <label><input type="number" name="budget" min="1000" max="2000000" value="$budget">Ваш бюджет</label>
        <label><select name="voltage" onchange="this.form.submit()">$voltage_options</select>Напруга</label>
        <label><select name="band" onchange="this.form.submit()">$band_options</select>Потужність</label>
        <div class="actions">
          <a href="/" class="btn ghost">Скинути</a>
          <button type="submit" name="action" value="calc" class="btn">Розрахувати</button>
        </div>
      </section>

      $error

      <section class="card">
$variants
      </section>
    </form>

    <section class="card">
      <h3>Надійність у часі</h3>
      <p class="hint">Шанс, що є хоч один робочий інвертор. Більше - краще</p>
      <div class="chart-box">$chart</div>
    </section>

    <section class="card">
      <h3>Висновок</h3>
      $result
    </section>

    <script>
      // зміна моделі перемальовує сторінку, щоб підтягнути ціну з бази
      document.querySelectorAll('select[name^="m"]').forEach(s => s.onchange = () => s.form.submit());
    </script>
